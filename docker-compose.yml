services:
  api:
    build: .
    container_name: pr_review_api
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=prreviewpassword
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pr_review_db
    depends_on:
      - redis
      - qdrant
      - neo4j
      - postgres
    volumes:
      - .:/app

  dashboard:
    build: .
    container_name: pr_review_dashboard
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      - api
    volumes:
      - .:/app

  redis:
    image: redis:7-alpine
    container_name: pr_review_redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: pr_review_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.24-community
    container_name: pr_review_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/prreviewpassword
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: pr_review_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pr_review_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_data:
  neo4j_data:
  postgres_data:
